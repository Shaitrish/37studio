<!--
  compositions/scene.html: one Three.js world drawn from timeline time alone (the pattern of the reels it was learned from).
  In the root index.html: load GSAP in <head>, then mount it with
    <div id="scene" class="clip" data-composition-id="scene" data-composition-src="compositions/scene.html"
         data-start="0" data-duration="8" data-track-index="0" data-width="1080" data-height="1920"></div>
  Copy build/three.module.js and build/three.core.js of one three release into assets/lib/ (the first imports the second).
-->
<template>
  <style>
    #scene { position: absolute; inset: 0; background: #03050b; overflow: hidden; }
    #scene-cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  </style>
  <div id="scene" data-composition-id="scene" data-width="1080" data-height="1920">
    <canvas id="scene-cv" width="1080" height="1920" data-layout-allow-overflow></canvas>
  </div>
  <script type="module">
    import * as THREE from "./assets/lib/three.module.js";

    // Every beat in seconds, timed to the voice. Keep them here (or in assets/cues.js) and nowhere else.
    const C = { dur: 8, dive: 2.4, label: 3.0, labelOut: 7.4 };
    const W = 1080, H = 1920;
    THREE.ColorManagement.enabled = false; // hex colours render as written, like CSS
    const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
    const seg = (t, a, b) => cl((t - a) / (b - a));
    const sm = (x) => x * x * (3 - 2 * x);
    const eio = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
    const win = (t, a, b, f = 0.3) => Math.min(sm(seg(t, a, a + f)), 1 - sm(seg(t, b - f, b)));
    const V = (x, y, z) => new THREE.Vector3(x, y, z);
    function rng(s) { return () => { s = (s + 0x6d2b79f5) | 0; let q = Math.imul(s ^ (s >>> 15), 1 | s); q = (q + Math.imul(q ^ (q >>> 7), 61 | q)) ^ q; return ((q ^ (q >>> 14)) >>> 0) / 4294967296; }; }
    // keyframes [[t, Vector3], ...], eased per segment; the 20% linear share keeps the camera from ever fully stopping
    function track(keys, t) {
      if (t <= keys[0][0]) return keys[0][1].clone();
      for (let i = 0; i < keys.length - 1; i++) {
        const [ta, a] = keys[i], [tb, b] = keys[i + 1];
        if (t <= tb) { const u = seg(t, ta, tb); return a.clone().lerp(b, eio(u) * 0.8 + u * 0.2); }
      }
      return keys[keys.length - 1][1].clone();
    }

    async function boot(canvas) {
      await document.fonts.load('700 120px "Display"', "Sample words"); // pass a sample in the script you draw
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(W, H, false);
      renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
      const rt = new THREE.WebGLRenderTarget(W, H, { samples: 4 }); // MSAA here, then one post pass
      const scene = new THREE.Scene();
      const cam = new THREE.PerspectiveCamera(40, W / H, 0.1, 5000);

      // stars: seeded, and moved with the camera every frame because they sit at infinity
      const r = rng(7), N = 4000, pos = [];
      for (let i = 0; i < N; i++) { const u = r() * 2 - 1, a = r() * 6.2832, q = Math.sqrt(1 - u * u); pos.push(q * Math.cos(a) * 2000, u * 2000, q * Math.sin(a) * 2000); }
      const sg = new THREE.BufferGeometry(); sg.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
      const stars = new THREE.Points(sg, new THREE.PointsMaterial({ color: "#cfdcff", size: 2.2, sizeAttenuation: false, depthWrite: false }));
      stars.frustumCulled = false; scene.add(stars);

      // globe: a drawn placeholder texture; swap in a real equirectangular map (TextureLoader, local file) for a real place
      const tc = document.createElement("canvas"); tc.width = 1024; tc.height = 512;
      const g = tc.getContext("2d"); g.fillStyle = "#0b2a4a"; g.fillRect(0, 0, 1024, 512);
      const r2 = rng(11); g.fillStyle = "#2f5a3a";
      for (let i = 0; i < 70; i++) { g.beginPath(); g.ellipse(r2() * 1024, 80 + r2() * 352, 20 + r2() * 70, 10 + r2() * 40, r2() * 3, 0, 6.2832); g.fill(); }
      const globe = new THREE.Mesh(new THREE.SphereGeometry(1, 96, 64), new THREE.MeshStandardMaterial({ map: new THREE.CanvasTexture(tc), roughness: 0.85 }));
      scene.add(globe);
      const atmo = new THREE.Mesh(new THREE.SphereGeometry(1.06, 64, 48), new THREE.ShaderMaterial({
        transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.BackSide,
        vertexShader: "varying vec3 vN; varying vec3 vV; void main(){ vec4 mv = modelViewMatrix * vec4(position,1.0); vN = normalMatrix * normal; vV = -mv.xyz; gl_Position = projectionMatrix * mv; }",
        fragmentShader: "varying vec3 vN; varying vec3 vV; void main(){ float f = pow(1.0 - clamp(abs(dot(normalize(vN), normalize(vV))), 0.0, 1.0), 2.0); gl_FragColor = vec4(vec3(0.35,0.6,1.0), f * 0.9); }",
      }));
      scene.add(atmo);
      // warm key, cool fill: a lone key light leaves the far side a flat black cutout
      const key = new THREE.DirectionalLight("#ffe2bd", 3.2); key.position.set(-3, 2, 4); scene.add(key);
      scene.add(new THREE.HemisphereLight("#6f93d8", "#05070d", 1.0));

      // a label: text drawn once on a canvas (the browser shapes any script), shown as a sprite
      const lc = document.createElement("canvas"), lg = lc.getContext("2d"), px = 120, text = "Sample words";
      lg.font = `700 ${px}px Display, sans-serif`; lc.width = Math.ceil(lg.measureText(text).width + px); lc.height = Math.ceil(px * 1.8);
      lg.font = `700 ${px}px Display, sans-serif`; lg.textAlign = "center"; lg.textBaseline = "middle";
      lg.shadowColor = "#ffc46b"; lg.shadowBlur = px * 0.35; lg.fillStyle = "#ffc46b"; lg.fillText(text, lc.width / 2, lc.height / 2);
      lg.shadowBlur = 0; lg.fillStyle = "#fff6e6"; lg.fillText(text, lc.width / 2, lc.height / 2);
      const label = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(lc), transparent: true, depthTest: false, depthWrite: false }));
      label.renderOrder = 50; scene.add(label);

      // post: vignette, grain, fade; drawn into the canvas at the composition's own size
      const postU = { tD: { value: rt.texture }, uSeed: { value: 0 }, uFade: { value: 1 } };
      const post = new THREE.Scene(), postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
      post.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({ uniforms: postU, depthTest: false,
        vertexShader: "varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }",
        fragmentShader: "uniform sampler2D tD; uniform float uSeed, uFade; varying vec2 vUv; float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233)) + uSeed) * 43758.5453); } void main(){ vec3 c = texture2D(tD, vUv).rgb; vec2 q = (vUv - 0.5) * vec2(1.0, 0.78); c *= 1.0 - 0.5 * smoothstep(0.22, 0.62, length(q)); c += (h(floor(vUv * vec2(1080.0, 1920.0) / 1.5)) - 0.5) * 0.035; gl_FragColor = vec4(c * uFade, 1.0); }",
      })));

      const camKeys = [[0, V(0, 0.3, 6.5)], [C.dive, V(0.4, 0.5, 3.4)], [C.dur, V(0.6, 0.65, 2.6)]];
      const tgtKeys = [[0, V(0, 0, 0)], [C.dive, V(0, 0.35, 0)], [C.dur, V(0, 0.45, 0)]];
      const fwd = V(0, 0, 0), up = V(0, 0, 0);
      return function render(t) {
        globe.rotation.y = -1.2 + t * 0.12; // everything moves, a little, all the time
        cam.position.copy(track(camKeys, t)).add(V(Math.sin(t * 0.7) * 0.01, Math.sin(t * 0.53 + 1) * 0.008, 0));
        cam.lookAt(track(tgtKeys, t)); cam.updateMatrixWorld();
        stars.position.copy(cam.position);
        // the label hangs in front of the camera, high in the frame, so no turn of the world carries it off screen
        fwd.set(0, 0, -1).applyQuaternion(cam.quaternion); up.set(0, 1, 0).applyQuaternion(cam.quaternion);
        label.position.copy(cam.position).addScaledVector(fwd, 10).addScaledVector(up, 1.9);
        const lh = 0.62; label.scale.set(lh * lc.width / lc.height, lh, 1);
        label.material.opacity = win(t, C.label, C.labelOut);
        postU.uSeed.value = Math.floor(t * 24) * 1.618; // grain changes 24 times a second, the same on every render
        postU.uFade.value = sm(seg(t, 0, 0.4)) * (1 - sm(seg(t, C.dur - 0.4, C.dur)));
        renderer.setRenderTarget(rt); renderer.render(scene, cam);
        renderer.setRenderTarget(null); renderer.render(post, postCam);
      };
    }

    const render = await boot(document.getElementById("scene-cv"));
    const st = { t: 0 };
    const tl = gsap.timeline({ paused: true });
    tl.to(st, { t: C.dur, duration: C.dur, ease: "none", onUpdate: () => render(st.t) }, 0);
    render(0);
    window.__timelines = window.__timelines || {};
    window.__timelines["scene"] = tl;
  </script>
</template>
