# The desktop app for Linux: built on every pull request and push to main (the files are kept as this run's
# artifacts), and attached to each GitHub release that release.sh publishes. Built on Ubuntu 24.04 so the program runs
# on 24.04 and anything newer. Windows and macOS come once the app runs there (docs/desktop.md).
name: desktop
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write # gh release upload
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            cmd/37studio-desktop/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: GTK 4 and WebKitGTK 6.0 headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev pkg-config
      - name: Vet the desktop module
        working-directory: cmd/37studio-desktop
        run: |
          mkdir -p web && touch web/.keep && cp ../../brand/37studio-icon-1024.png icon.png # what go:embed needs; build.sh puts the real UI here
          go vet .
      - name: Package
        run: ./desktop/package-linux.sh "${{ github.event.release.tag_name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: 37studio-linux-${{ runner.arch }}
          path: desktop/dist/*
          if-no-files-found: error
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" desktop/dist/* --clobber
