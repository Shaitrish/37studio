name = "37studio"
main = "src.js"
compatibility_date = "2026-09-01"
routes = [{ pattern = "studio.shaitrish.com", custom_domain = true }]

[assets]
directory = "./public"
binding = "ASSETS"

[vars]
META_APP_ID = "2057436148296558"
# Leaked or refunded keys: the first 16 characters after the last dot of each key, comma-separated. Redeploy after editing.
REVOKED_LICENSES = ""
# "live" charges real money through SSLCommerz; anything else uses its sandbox (pay.js).
SSLCZ_MODE = "sandbox"

# WhatsApp messages from Meta's webhook, held until each copy pulls them (schema.sql)
[[d1_databases]]
binding = "DB"
database_name = "studio37"
database_id = "0bd4d12c-5bf3-4d05-a680-c9ecc72754de"
